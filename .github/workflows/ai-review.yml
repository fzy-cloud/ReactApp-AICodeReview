name: AI Code Review

# 仅在 PR 触发（针对 dev 分支），最省额度
on:
  pull_request:
    branches: [dev]

permissions:
  contents: read
  pull-requests: write # 用于发布行内评论与顶层评论
  issues: write        # 用于给 PR（本质是 issue）发顶层评论

jobs:
  ai-review:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 获取 PR diff（写入文件，避免超大内联参数）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh api repos/${{ github.repository }}/pulls/${PR_NUMBER} \
            --header "Accept: application/vnd.github.v3.diff" | head -c 200000 > pr.diff
          echo "diff bytes: $(wc -c < pr.diff)"

      - name: 运行 AI 评审（智谱 GLM，结构化 JSON -> review.json）
        id: review
        env:
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          ZHIPU_MODEL: glm-4-flash
        run: |
          node scripts/ai-review.mjs pr.diff > review.json
          echo "review.json bytes: $(wc -c < review.json)"

      - name: 发布评审评论（读 review.json，用 gh CLI 发评论）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node scripts/post-review.mjs
