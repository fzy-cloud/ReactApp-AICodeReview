name: AI Code Review

# 仅在 PR 触发（针对 dev 分支），最省额度
on:
  pull_request:
    branches: [dev]

permissions:
  contents: read
  pull-requests: write # 用于发布行内评论与顶层评论

jobs:
  ai-review:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 获取 PR diff
        id: diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          diff=$(gh api repos/${{ github.repository }}/pulls/${PR_NUMBER} \
            --header "Accept: application/vnd.github.v3.diff" | head -c 60000)
          {
            echo "diff<<EOF"
            echo "$diff"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: 运行 AI 评审（智谱 GLM，结构化 JSON）
        if: ${{ steps.diff.outputs.diff != '' }}
        id: review
        env:
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          ZHIPU_MODEL: glm-4-flash
        run: |
          review=$(node scripts/ai-review.mjs "${{ steps.diff.outputs.diff }}")
          {
            echo "result<<EOF"
            echo "$review"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # 发布行内评论（需求 2.2 MR 行内评论）
      - name: 发布行内评论
        if: ${{ steps.diff.outputs.diff != '' && steps.review.outputs.result != '' }}
        uses: actions/github-script@v7
        with:
          script: |
            const result = JSON.parse(`${{ steps.review.outputs.result }}`);
            const comments = result.comments || [];
            const sha = context.payload.pull_request.head.sha;
            const prNumber = context.payload.pull_request.number;

            for (const c of comments) {
              if (!c.path || c.line == null) continue; // 无法定位行的，后面放顶层
              try {
                await github.rest.pulls.createReviewComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: prNumber,
                  commit_id: sha,
                  path: c.path,
                  line: Number(c.line),
                  side: 'RIGHT',
                  body: `**[${c.severity || 'info'}] ${c.category || ''}**\n\n${c.body}`,
                });
              } catch (e) {
                core.warning(`行内评论失败 ${c.path}:${c.line} - ${e.message}`);
              }
            }

      # 发布顶层总评（变更摘要 + 风险分级 + 无法定位行的评论）
      - name: 发布顶层总评
        if: ${{ steps.diff.outputs.diff != '' && steps.review.outputs.result != '' }}
        uses: actions/github-script@v7
        with:
          script: |
            const result = JSON.parse(`${{ steps.review.outputs.result }}`);
            const riskMap = { block: '🚫 阻塞', warn: '⚠️ 建议', info: 'ℹ️ 参考', none: '✅ 无明显问题' };
            const risk = riskMap[result.risk] || 'ℹ️ 参考';

            let body = `## 🤖 AI Code Review（智谱 GLM）\n\n`;
            body += `**整体风险分级**：${risk}\n\n`;
            body += `**变更摘要**：${result.summary || '（无）'}\n\n`;

            const topComments = (result.comments || []).filter(c => !c.path || c.line == null);
            if (topComments.length) {
              body += `### 其他意见（无法定位到具体行）\n`;
              for (const c of topComments) {
                body += `- **[${c.severity || 'info'}] ${c.category || ''}** ${c.body}\n`;
              }
            } else if ((result.comments || []).length === 0) {
              body += `本次变更未发现问题，整体良好。\n`;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body,
            });
