name: AI Code Review

# 仅在 PR 触发（针对 dev 分支），最省额度
on:
  pull_request:
    branches: [dev]

permissions:
  contents: read
  pull-requests: write # 用于发布行内评论与顶层评论

jobs:
  ai-review:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 获取 PR diff
        id: diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          diff=$(gh api repos/${{ github.repository }}/pulls/${PR_NUMBER} \
            --header "Accept: application/vnd.github.v3.diff" | head -c 200000)
          {
            echo "diff<<EOF"
            echo "$diff"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: 运行 AI 评审（智谱 GLM，结构化 JSON）
        if: ${{ steps.diff.outputs.diff != '' }}
        id: review
        env:
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          ZHIPU_MODEL: glm-4-flash
        run: |
          review=$(node scripts/ai-review.mjs "${{ steps.diff.outputs.diff }}")
          {
            echo "result<<EOF"
            echo "$review"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # 发布行内评论 + 顶层总评（合并为一步，行内失败自动降级到顶层）
      - name: 发布评审评论
        if: ${{ steps.diff.outputs.diff != '' && steps.review.outputs.result != '' }}
        uses: actions/github-script@v7
        with:
          script: |
            const result = JSON.parse(`${{ steps.review.outputs.result }}`);
            const comments = result.comments || [];
            const sha = context.payload.pull_request.head.sha;
            const prNumber = context.payload.pull_request.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // 行内评论尝试，失败则收集进降级列表
            const fallback = [];
            for (const c of comments) {
              if (!c.path || c.line == null) {
                fallback.push(c); // 本就无法定位行的，直接放顶层
                continue;
              }
              try {
                await github.rest.pulls.createReviewComment({
                  owner,
                  repo,
                  pull_number: prNumber,
                  commit_id: sha,
                  path: c.path,
                  line: Number(c.line),
                  side: 'RIGHT',
                  body: `**[${c.severity || 'info'}] ${c.category || ''}**\n\n${c.body}`,
                });
              } catch (e) {
                core.warning(`行内评论失败 ${c.path}:${c.line} - ${e.message}`);
                fallback.push(c); // 降级到顶层，避免意见丢失
              }
            }

            // 顶层总评：变更摘要 + 风险分级 + 降级/无法定位的评论
            const riskMap = { block: '🚫 阻塞', warn: '⚠️ 建议', info: 'ℹ️ 参考', none: '✅ 无明显问题' };
            const risk = riskMap[result.risk] || 'ℹ️ 参考';

            let body = `## 🤖 AI Code Review（智谱 GLM）\n\n`;
            body += `**整体风险分级**：${risk}\n\n`;
            body += `**变更摘要**：${result.summary || '（无）'}\n\n`;

            if (fallback.length) {
              body += `### 其他意见（无法定位到具体行 / 行内发布失败）\n`;
              for (const c of fallback) {
                const loc = c.path ? `${c.path}${c.line != null ? ':' + c.line : ''} ` : '';
                body += `- **[${c.severity || 'info'}] ${c.category || ''}** ${loc}${c.body}\n`;
              }
            } else if (comments.length === 0) {
              body += `本次变更未发现问题，整体良好。\n`;
            } else {
              body += `以上意见均已作为行内评论发布到对应代码位置。\n`;
            }

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: prNumber,
              body,
            });
